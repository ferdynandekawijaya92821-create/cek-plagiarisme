<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@600&display=swap">
<style>
  /* Sumber gambar pratinjau tautan (1200x630). Dirender ke og-image.png oleh render_assets.js */
  * { box-sizing: border-box; margin: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; background: #0f1b2a; font-family: Inter, sans-serif; color: #e5ecf4; position: relative; }
  .bg { position: absolute; inset: 0; background:
      radial-gradient(700px 420px at 92% 18%, rgba(79,193,222,.22), transparent 70%),
      radial-gradient(520px 380px at 8% 105%, rgba(14,106,134,.45), transparent 70%); }
  .left { position: absolute; left: 72px; top: 70px; width: 560px; }
  .logo { display: flex; align-items: center; gap: 16px; }
  .logo b { font: 800 40px Manrope, sans-serif; letter-spacing: -.02em; }
  .logo b span { color: #4fc1de; }
  h1 { margin-top: 54px; font: 800 62px/1.05 Manrope, sans-serif; letter-spacing: -.03em; }
  h1 em { font-style: normal; color: #4fc1de; }
  p { margin-top: 26px; font-size: 25px; line-height: 1.45; color: #b6c3d4; }
  .chips { position: absolute; left: 72px; bottom: 62px; display: flex; gap: 12px; }
  .chip { font: 600 19px Inter, sans-serif; padding: 10px 18px; border-radius: 99px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.14); }
  .card { position: absolute; right: 64px; top: 92px; width: 430px; background: #fff; color: #0f1b2a; border-radius: 22px; padding: 30px; box-shadow: 0 30px 80px rgba(0,0,0,.45); }
  .rings { display: flex; justify-content: space-around; }
  .r { display: grid; justify-items: center; gap: 10px; }
  .ring { width: 118px; height: 118px; border-radius: 50%; display: grid; place-items: center; }
  .ring span { width: 92px; height: 92px; border-radius: 50%; background: #fff; display: grid; place-items: center; font: 600 27px "JetBrains Mono", monospace; }
  .lbl { font: 700 13px Inter, sans-serif; letter-spacing: .1em; color: #5a6577; }
  .pill { font: 600 14px Inter, sans-serif; padding: 3px 12px; border-radius: 99px; border: 1.5px solid currentColor; }
  .lines { margin-top: 26px; display: grid; gap: 11px; }
  .ln { height: 13px; border-radius: 7px; background: #e6ebf1; }
  .ln.hl { background: #f9d3e3; box-shadow: inset 0 -3px 0 #c2185b; }
  .ln.hl2 { background: #d6e2fb; box-shadow: inset 0 -3px 0 #2f5fd0; }
  .src { margin-top: 24px; display: flex; align-items: center; gap: 10px; font: 600 16px Inter, sans-serif; }
  .bdg { color: #fff; font: 700 14px Inter, sans-serif; border-radius: 99px; padding: 3px 12px; }
  .src .pct { margin-left: auto; font: 600 16px "JetBrains Mono", monospace; }
</style></head>
<body><div class="bg"></div>
  <div class="left">
    <div class="logo">
      <svg width="58" height="58" viewBox="0 0 32 32"><rect width="32" height="32" rx="8" fill="#4fc1de"/><path d="M9 7h10l5 5v12a1 1 0 0 1-1 1H9a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1z" fill="#0f1b2a"/><path d="M11 14h8M11 17h6M11 20h4" stroke="#4fc1de" stroke-width="1.6" stroke-linecap="round"/><circle cx="20.5" cy="20.5" r="3.3" fill="none" stroke="#ffffff" stroke-width="1.6"/><path d="M23 23l2.6 2.6" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/></svg>
      <b>Cek<span>Teks</span></b>
    </div>
    <h1>Cek plagiarisme &amp; deteksi <em>tulisan AI</em></h1>
    <p>Unggah PDF atau Word, lihat bagian yang mirip dengan sumbernya, lalu unduh laporan PDF.</p>
  </div>
  <div class="chips"><span class="chip">Gratis</span><span class="chip">Bisa offline</span><span class="chip">Naskah tetap privat</span></div>
  <div class="card">
    <div class="rings">
      <div class="r"><div class="ring" style="background:conic-gradient(#b5700c 0 38%, #eef2f6 0)"><span>38%</span></div><div class="lbl">KESAMAAN</div><span class="pill" style="color:#b5700c">Ada kemiripan</span></div>
      <div class="r"><div class="ring" style="background:conic-gradient(#1d7f55 0 12%, #eef2f6 0)"><span>12%</span></div><div class="lbl">KEMUNGKINAN AI</div><span class="pill" style="color:#1d7f55">Cenderung manusia</span></div>
    </div>
    <div class="lines">
      <div class="ln" style="width:100%"></div><div class="ln hl" style="width:92%"></div><div class="ln hl" style="width:70%"></div>
      <div class="ln" style="width:96%"></div><div class="ln hl2" style="width:84%"></div><div class="ln" style="width:60%"></div>
    </div>
    <div class="src"><span class="bdg" style="background:#c2185b">1</span>id.wikipedia.org<span class="pct">24%</span></div>
    <div class="src" style="margin-top:10px"><span class="bdg" style="background:#2f5fd0">2</span>Jurnal ilmiah<span class="pct">14%</span></div>
  </div>
</body></html>
