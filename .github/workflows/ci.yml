# Pemeriksaan otomatis untuk setiap pull request dan perubahan di main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Pasang dependensi Python
        run: pip install -r cekteks/requirements.txt pytest
      - name: Uji mesin Python
        run: python -m pytest -q cekteks/tests

      # Hanya untuk pull request. Pemilik boleh mengubah site.json langsung di main lewat editor GitHub;
      # situs dan aplikasi dibangun ulang otomatis oleh pages.yml dan apps.yml.
      - name: Hasil build harus sudah di-commit
        if: github.event_name == 'pull_request'
        run: |
          python cekteks/web/build.py
          if ! git diff --quiet -- docs cekteks/dist; then
            echo "::error::Hasil build berbeda. Jalankan 'python cekteks/web/build.py' lalu commit folder docs/ dan cekteks/dist/."
            git diff --stat -- docs cekteks/dist
            exit 1
          fi

      - name: Uji keamanan basis data login (Row Level Security)
        run: bash cekteks/supabase/uji.sh

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Uji jembatan (Cloudflare Worker)
        run: node cekteks/jembatan/test.mjs
      - name: Pasang Playwright dan axe-core
        working-directory: cekteks/web
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Uji ujung-ke-ujung di browser
        working-directory: cekteks/web
        run: npm test
