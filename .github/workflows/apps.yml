# Membangun aplikasi CekTeks: Android (APK, Capacitor) serta Windows, macOS, dan Linux (Electron).
# Pull request: hanya memastikan semua aplikasi berhasil dibangun.
# Push ke main: hasilnya diterbitkan sebagai GitHub Release "v<versi>" dengan nama berkas tetap,
# sehingga tautan .../releases/latest/download/CekTeks-Android.apk selalu mengarah ke versi terbaru.
name: Aplikasi

on:
  push:
    branches: [main]
    paths: ["cekteks/web/**", "cekteks/dist/**", "cekteks/app/**", ".github/workflows/apps.yml"]
  pull_request:
    paths: ["cekteks/web/src/**", "cekteks/web/site.json", "cekteks/app/**", ".github/workflows/apps.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Bangun CekTeks.html (memakai site.json terbaru)
        run: python cekteks/web/build.py
      - name: Salin CekTeks.html ke proyek Android
        run: mkdir -p cekteks/app/mobile/www && cp cekteks/dist/CekTeks.html cekteks/app/mobile/www/index.html
      - name: Pasang Capacitor
        working-directory: cekteks/app/mobile
        run: npm install --no-audit --no-fund
      - name: Buat proyek Android dan ikon
        working-directory: cekteks/app/mobile
        run: |
          npx cap add android
          npx capacitor-assets generate --android --iconBackgroundColor '#0e6a86' --iconBackgroundColorDark '#0e6a86'
          npx cap sync android
      - name: Versi aplikasi
        working-directory: cekteks/app/mobile/android
        run: |
          V=$(grep -o 'APP_VERSION = "[^"]*"' ../../../web/src/app.html | cut -d'"' -f2)
          CODE=$(echo "$V" | awk -F. '{print $1*10000 + $2*100 + $3}')
          sed -i "s/versionCode 1$/versionCode $CODE/; s/versionName \"1.0\"/versionName \"$V\"/" app/build.gradle
          grep -n "versionCode\|versionName" app/build.gradle
      - name: Kunci penandatangan (opsional, dari secret ANDROID_KEYSTORE_BASE64)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then echo "$KEYSTORE_B64" | base64 -d > cekteks/app/mobile/android/app/cekteks.keystore; echo "Memakai kunci tetap."; else echo "Tanpa kunci tetap: APK ditandatangani kunci debug."; fi
      - name: Bangun APK
        working-directory: cekteks/app/mobile/android
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -f app/cekteks.keystore ] && [ -n "$KS_PASS" ]; then
            ./gradlew assembleRelease --no-daemon \
              -Pandroid.injected.signing.store.file="$PWD/app/cekteks.keystore" -Pandroid.injected.signing.store.password="$KS_PASS" \
              -Pandroid.injected.signing.key.alias=cekteks -Pandroid.injected.signing.key.password="$KS_PASS"
            cp app/build/outputs/apk/release/app-release.apk ../../../../CekTeks-Android.apk
          else
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk ../../../../CekTeks-Android.apk
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: CekTeks-Android.apk
          if-no-files-found: error

  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Bangun CekTeks.html (memakai site.json terbaru)
        run: python cekteks/web/build.py
      - name: Salin CekTeks.html ke aplikasi desktop
        run: mkdir -p cekteks/app/desktop/app && cp cekteks/dist/CekTeks.html cekteks/app/desktop/app/index.html
      - name: Pasang Electron
        working-directory: cekteks/app/desktop
        run: npm install --no-audit --no-fund
      - name: Bangun aplikasi
        working-directory: cekteks/app/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          V=$(grep -o 'APP_VERSION = "[^"]*"' ../../web/src/app.html | cut -d'"' -f2)
          npm pkg set version="$V"
          npx electron-builder --publish never
          ls -la dist
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.os }}
          path: |
            cekteks/app/desktop/dist/CekTeks-Windows.exe
            cekteks/app/desktop/dist/CekTeks-macOS.dmg
            cekteks/app/desktop/dist/CekTeks-Linux.AppImage
          if-no-files-found: error

  release:
    if: github.event_name != 'pull_request'
    needs: [android, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: out
          merge-multiple: true
      - name: Terbitkan rilis
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(grep -o 'APP_VERSION = "[^"]*"' cekteks/web/src/app.html | cut -d'"' -f2)
          ls -la out
          if ! gh release view "v$V" >/dev/null 2>&1; then
            gh release create "v$V" --target "$GITHUB_SHA" --title "CekTeks $V" --latest \
              --notes "Aplikasi CekTeks $V untuk Android, Windows, macOS, dan Linux. Berjalan offline. Situs: https://ferdynandekawijaya92821-create.github.io/kalori-cli/ · Catatan perubahan: cekteks/CHANGELOG.md"
          fi
          gh release upload "v$V" out/* --clobber
